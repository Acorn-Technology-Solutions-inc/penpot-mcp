version: '3.8'

services:
  penpot-mcp:
    build:
      context: .
      target: base
    image: penpot-mcp:latest
    container_name: penpot-mcp-server
    environment:
      - PENPOT_API_URL=${PENPOT_API_URL:-https://design.penpot.app/api}
      - PENPOT_ACCESS_TOKEN=${PENPOT_ACCESS_TOKEN}
      - DEBUG=${DEBUG:-false}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - penpot-network

  # Development service
  penpot-mcp-dev:
    build:
      context: .
      target: development
    image: penpot-mcp:dev
    container_name: penpot-mcp-dev
    environment:
      - PENPOT_API_URL=${PENPOT_API_URL:-https://design.penpot.app/api}
      - PENPOT_ACCESS_TOKEN=${PENPOT_ACCESS_TOKEN}
      - DEBUG=true
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: pytest -v --cov=penpot_mcp
    networks:
      - penpot-network

networks:
  penpot-network:
    driver: bridge
